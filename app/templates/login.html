{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold">登入</h2>
                <p class="text-muted">歡迎回到選課交換平台</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-4">
                    <label for="email" class="form-label text-muted small text-uppercase fw-bold">學校信箱</label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="學號@o365.xxx.edu.tw" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label text-muted small text-uppercase fw-bold">密碼</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="d-grid mt-5">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill">登入系統</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="mb-0 text-muted">還沒有帳號？ <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">立即註冊</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
